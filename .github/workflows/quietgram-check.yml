name: Quietgram code checks
on:
  push:
    paths:
      - 'remote/**'
      - 'package.json'
      - 'Quietgram.user.js'
      - 'Quietgram.bookmarklet.js'
      - 'test.js'
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
